<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikaruStart</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.15);
            --blur: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 50px;
            animation: fadeIn 0.8s ease-out;
        }

        .clock-container { padding: 12px 25px; }
        .clock { font-size: 2.2rem; font-weight: 200; letter-spacing: 2px; }

        .weather-widget { display: flex; align-items: center; padding: 10px 20px; }
        select { background: transparent; color: white; border: none; outline: none; cursor: pointer; font-size: 0.9rem; }
        select option { background: #1a1a1a; }

        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 5vh;
            animation: fadeIn 1s ease-out 0.2s backwards;
        }

        .logo {
            font-size: 4.5rem;
            font-weight: 800;
            margin-bottom: 35px;
            letter-spacing: -2px;
            background: linear-gradient(180deg, #fff 0%, rgba(255,255,255,0.5) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .search-container { width: 100%; max-width: 600px; margin-bottom: 0; }
        .search-bar { display: flex; padding: 10px 15px 10px 25px; border-radius: 50px; }
        .search-bar:focus-within { background: rgba(255, 255, 255, 0.12); transform: scale(1.02); }

        input[type="text"] { flex-grow: 1; border: none; outline: none; font-size: 1.1rem; color: #fff; background: transparent; }
        input::placeholder { color: rgba(255,255,255,0.4); }

        .search-btn { background: transparent; border: none; cursor: pointer; padding: 8px; display: flex; }
        .search-btn svg { fill: white; width: 22px; height: 22px; opacity: 0.6; transition: 0.3s; }
        .search-btn:hover svg { opacity: 1; }

        .shortcuts { display: flex; gap: 15px; animation: fadeIn 1.2s ease-out 0.4s backwards; }
        .shortcut-item {
            width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .shortcut-item:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.15); }
        .shortcut-item svg { width: 28px; height: 28px; fill: white; opacity: 0.9; }

        .widgets-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 100%;
            max-width: 960px;
        }

        .widget {
            min-width: 260px;
            max-width: 420px;
        }

        .widget.dragging {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .move-mode .widget {
            cursor: move;
            outline: 1px dashed rgba(255, 255, 255, 0.35);
        }

        .widget-hidden {
            display: none !important;
        }

        .spotify-card {
            padding: 16px 18px;
        }

        .spotify-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .spotify-title {
            font-size: 0.9rem;
            font-weight: 500;
            opacity: 0.9;
        }

        .spotify-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 220px;
            overflow: auto;
        }

        .spotify-empty {
            font-size: 0.8rem;
            opacity: 0.6;
        }

        /* Дисклеймер */
        footer {
            padding: 20px;
            text-align: center;
            animation: fadeIn 1.5s ease-out 0.6s backwards;
        }
        .disclaimer {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            max-width: 600px;
            margin: 0 auto;
            line-height: 1.4;
        }

        .version {
            margin-top: 8px;
            font-size: 10px;
            color: rgba(255, 255, 255, 0.35);
        }

        /* Settings */
        .settings-icon { position: fixed; bottom: 25px; right: 25px; cursor: pointer; padding: 12px; border-radius: 50%; z-index: 101; }
        .settings-panel {
            position: fixed; bottom: 85px; right: 25px; width: 280px; padding: 20px;
            display: none; flex-direction: column; gap: 15px; z-index: 100;
        }
        .settings-panel.active { display: flex; animation: fadeIn 0.3s ease; }
        .setting-item { display: flex; flex-direction: column; gap: 5px; }
        .setting-item label { font-size: 10px; opacity: 0.5; text-transform: uppercase; letter-spacing: 1px; }
        .setting-item select, .setting-item button {
            background: rgba(255,255,255,0.08); border: 1px solid var(--glass-border);
            color: white; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 13px;
        }

        .settings-panel .widgets-toggle-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
        }

        .settings-panel input[type="checkbox"] {
            margin-right: 6px;
        }

        .settings-panel input[type="text"] {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 6px 8px;
            border-radius: 8px;
            font-size: 12px;
            outline: none;
        }

        .settings-panel input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .settings-panel .spotify-settings {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .settings-panel .spotify-buttons {
            display: flex;
            gap: 6px;
        }

        .settings-panel .spotify-buttons button {
            flex: 1;
        }
    </style>
</head>
<body>

    <header>
        <div class="clock-container glass"><div class="clock" id="clock">00:00</div></div>
        <div class="weather-widget glass">
            <select id="city-select"></select>
            <div id="temp" style="margin-left: 10px; font-weight: 500;">--°C</div>
        </div>
    </header>

    <main>
        <div class="logo">MikaruStart</div>

        <div class="widgets-container">

                        <input type="text" name="q" id="search-input" placeholder="Search..." autofocus autocomplete="off">
                        <button type="submit" class="search-btn">
                            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 1 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                        </button>
                    </form>
                </div>
            </section>

            <section class="widget" data-widget="shortcuts">

                    <a href="https://youtube.com" class="shortcut-item glass" title="YouTube"><svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg></a>
                    <a href="https://discord.com" class="shortcut-item glass" title="Discord"><svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037 19.736 19.736 0 0 0-4.885 1.515.069.069 0 0 0-.032.027C.533 9.048-.32 13.579.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.862-1.297 1.197-1.99a.076.076 0 0 0-.041-.105 13.11 13.11 0 0 1-1.872-.89.077.077 0 0 1-.008-.128c.126-.094.252-.192.372-.291a.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.196.373.291a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.89.076.076 0 0 0-.041.106c.335.693.735 1.36 1.197 1.99a.078.078 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.06.06 0 0 0-.031-.03z"/></svg></a>
                    <a href="https://t.me" class="shortcut-item glass" title="Telegram"><svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zM17.5 8.083l-1.926 9.08c-.145.64-.524.796-1.06.495l-2.936-2.164-1.417 1.364c-.156.156-.287.287-.588.287l.211-3.001 5.46-4.932c.237-.21-.051-.328-.368-.117l-6.75 4.25-2.907-.908c-.633-.198-.645-.633.132-.934l11.366-4.38c.526-.192.986.123.826.855z"/></svg></a>

                </div>
            </section>

            <section class="widget" data-widget="spotify">
                <div class="spotify-card glass">
                    <div class="spotify-header">
                        <span class="spotify-title">Spotify</span>
                    </div>
                    <div id="spotify-list" class="spotify-list"></div>
                </div>
            </section>
        </div>
    </main>

    <footer>
        <p class="disclaimer">Instagram — продукт компании Meta Platforms Inc., деятельность которой запрещена на территории Российской Федерации.</p>
        <p class="version">MikaruStart <span id="version-text">v.1.0.1</span></p>
    </footer>

    <div class="settings-icon glass" onclick="toggleSettings()"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.487.487 0 0 0-.59.22L3.91 8.87a.49.49 0 0 0 .12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47.01.59-.22l1.92-3.32a.49.49 0 0 0-.12-.61l-2.03-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>

    <div class="settings-panel glass" id="settings-panel">
        <div class="setting-item">
            <label id="label-lang">Язык</label>
            <select id="lang-select">
                <option value="ru">Русский</option>
                <option value="en">English</option>
            </select>
        </div>
        <div class="setting-item">
            <label id="label-engine">Поисковик</label>
            <select id="engine-select">
                <option value="google">Google</option>
                <option value="yandex">Yandex</option>
            </select>
        </div>
        <div class="setting-item">
            <label id="label-color">Тема фона</label>
            <button id="btn-next">Сменить цвет</button>
        </div>
        <div class="setting-item">
            <label id="label-widgets">Виджеты</label>
            <div class="widgets-toggle-list">
                <label><input type="checkbox" data-widget-toggle="search" checked> Поиск</label>
                <label><input type="checkbox" data-widget-toggle="shortcuts" checked> Ссылки</label>
                <label><input type="checkbox" data-widget-toggle="spotify" checked> Spotify</label>
            </div>
        </div>
        <div class="setting-item">
            <label id="label-move">Режим перемещения</label>
            <button id="btn-move-mode">Включить</button>
        </div>
        <div class="setting-item">
            <label id="label-spotify">Spotify</label>
            <div class="spotify-settings">
                <input type="text" id="spotify-url" placeholder="Ссылка на плейлист Spotify">
                <div class="spotify-buttons">
                    <button id="spotify-add-btn" type="button">Добавить</button>
                    <button id="spotify-clear-btn" type="button">Очистить</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DB_VERSION = "1.0.1";
        const DB_KEY = "mikaruStart_state";

        const translations = {
            ru: {
                placeholder: "Поиск...",
                labelLang: "Язык",
                labelEngine: "Поисковик",
                labelColor: "Тема фона",
                btnNext: "Сменить цвет",
                labelWidgets: "Виджеты",
                labelMove: "Режим перемещения",
                btnMoveOn: "Включить",
                btnMoveOff: "Выключить",
                labelSpotify: "Spotify",
                spotifyPlaceholder: "Ссылка на плейлист Spotify",
                btnSpotifyAdd: "Добавить",
                btnSpotifyClear: "Очистить",
                noPlaylists: "Плейлисты не добавлены"
            },
            en: {
                placeholder: "Search...",
                labelLang: "Language",
                labelEngine: "Search engine",
                labelColor: "Background theme",
                btnNext: "Change color",
                labelWidgets: "Widgets",
                labelMove: "Move mode",
                btnMoveOn: "Enable",
                btnMoveOff: "Disable",
                labelSpotify: "Spotify",
                spotifyPlaceholder: "Spotify playlist URL",
                btnSpotifyAdd: "Add",
                btnSpotifyClear: "Clear",
                noPlaylists: "No playlists yet"
            }
        };

        const gradients = [
            "linear-gradient(135deg, #0f0c29, #302b63, #24243e)", "linear-gradient(135deg, #141e30, #243b55)",
            "linear-gradient(135deg, #232526, #414345)", "linear-gradient(135deg, #1a1a24, #0d0d14)",
            "linear-gradient(135deg, #000428, #004e92)", "linear-gradient(135deg, #1f1c2c, #928dab)",
            "linear-gradient(135deg, #2c3e50, #000000)", "linear-gradient(135deg, #373b44, #4286f4)",
            "linear-gradient(135deg, #434343, #000000)", "linear-gradient(135deg, #093028, #237A57)",
            "linear-gradient(135deg, #1e3c72, #2a5298)", "linear-gradient(135deg, #2b5876, #4e4376)",
            "linear-gradient(135deg, #16222A, #3A6073)", "linear-gradient(135deg, #051937, #004d7a)",
            "linear-gradient(135deg, #141517, #2c2d30)", "linear-gradient(135deg, #1b2735, #090a0f)",
            "linear-gradient(135deg, #283048, #859398)", "linear-gradient(135deg, #200122, #6f0000)",
            "linear-gradient(135deg, #0b8793, #360033)", "linear-gradient(135deg, #4b6cb7, #182848)",
            "linear-gradient(135deg, #5f2c82, #49a09d)", "linear-gradient(135deg, #2193b0, #6dd5ed)",
            "linear-gradient(135deg, #3a1c71, #d76d77)", "linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d)",
            "linear-gradient(135deg, #00c6ff, #0072ff)", "linear-gradient(135deg, #40e0d0, #ff8c00, #ff0080)",
            "linear-gradient(135deg, #3E5151, #DECBA4)", "linear-gradient(135deg, #114357, #F29492)",
            "linear-gradient(135deg, #02aab0, #00cdac)", "linear-gradient(135deg, #2c3e50, #4ca1af)"
        ];

        const defaultState = {
            version: DB_VERSION,
            lang: "ru",
            engine: "google",
            gradientIndex: 0,
            city: "Москва",
            widgetOrder: ["search", "shortcuts", "spotify"],
            hiddenWidgets: [],
            spotifyPlaylists: [
                "https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M"
            ],
            moveMode: false
        };

        function loadState() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (!raw) return { ...defaultState };
                const parsed = JSON.parse(raw);
                if (!parsed || typeof parsed !== "object") return { ...defaultState };
                const merged = { ...defaultState, ...parsed };
                merged.version = DB_VERSION;
                return merged;
            } catch (e) {
                return { ...defaultState };
            }
        }

        let state = loadState();

        function saveState() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(state));
            } catch (e) {
                // ignore
            }
        }

        function updateClock() {
            const now = new Date();
            const clockEl = document.getElementById("clock");
            if (clockEl) {
                clockEl.textContent = now.toLocaleTimeString("ru-RU", {
                    hour: "2-digit",
                    minute: "2-digit"
                });
            }
        }

        setInterval(updateClock, 1000);
        updateClock();

        function toggleSettings() {
            const panel = document.getElementById("settings-panel");
            if (panel) panel.classList.toggle("active");
        }

        function nextGradient() {
            state.gradientIndex = ((state.gradientIndex || 0) + 1) % gradients.length;
            document.body.style.background = gradients[state.gradientIndex];
            saveState();
        }

        function getWidgetElements() {
            return Array.from(document.querySelectorAll("[data-widget]"));
        }

        function setMoveMode(enabled, options = {}) {
            state.moveMode = enabled;
            document.body.classList.toggle("move-mode", enabled);
            getWidgetElements().forEach((el) => {
                el.draggable = enabled;
            });
            const lang = state.lang || "ru";
            const t = translations[lang] || translations.ru;
            const btn = document.getElementById("btn-move-mode");
            if (btn) {
                btn.textContent = enabled ? t.btnMoveOff : t.btnMoveOn;
            }
            if (!options.skipSave) {
                saveState();
            }
        }

        function toggleMoveMode() {
            setMoveMode(!state.moveMode);
        }

        function changeLang() {
            const lang = state.lang || "ru";
            const t = translations[lang] || translations.ru;

            const input = document.getElementById("search-input");
            if (input) input.placeholder = t.placeholder;

            const labelLang = document.getElementById("label-lang");
            if (labelLang) labelLang.textContent = t.labelLang;

            const labelEngine = document.getElementById("label-engine");
            if (labelEngine) labelEngine.textContent = t.labelEngine;

            const labelColor = document.getElementById("label-color");
            if (labelColor) labelColor.textContent = t.labelColor;

            const btnNext = document.getElementById("btn-next");
            if (btnNext) btnNext.textContent = t.btnNext;

            const labelWidgets = document.getElementById("label-widgets");
            if (labelWidgets) labelWidgets.textContent = t.labelWidgets;

            const labelMove = document.getElementById("label-move");
            if (labelMove) labelMove.textContent = t.labelMove;

            const labelSpotify = document.getElementById("label-spotify");
            if (labelSpotify) labelSpotify.textContent = t.labelSpotify;

            const spotifyInput = document.getElementById("spotify-url");
            if (spotifyInput) spotifyInput.placeholder = t.spotifyPlaceholder;

            const addBtn = document.getElementById("spotify-add-btn");
            if (addBtn) addBtn.textContent = t.btnSpotifyAdd;

            const clearBtn = document.getElementById("spotify-clear-btn");
            if (clearBtn) clearBtn.textContent = t.btnSpotifyClear;

            setMoveMode(state.moveMode, { skipSave: true });

            renderSpotifyPlaylists();
        }

        function changeEngine() {
            const engine = state.engine || "google";
            const form = document.getElementById("search-form");
            const input = document.getElementById("search-input");
            if (!form || !input) return;

            if (engine === "yandex") {
                form.action = "https://yandex.ru/search/";
                input.name = "text";
            } else {
                form.action = "https://www.google.com/search";
                input.name = "q";
            }
        }

        let dragSrcEl = null;

        function handleDragStart(e) {
            if (!state.moveMode) {
                e.preventDefault();
                return;
            }
            dragSrcEl = this;
            this.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
        }

        function handleDragOver(e) {
            if (!state.moveMode) return;
            e.preventDefault();
        }

        function handleDrop(e) {
            if (!state.moveMode) return;
            e.preventDefault();
            if (!dragSrcEl || dragSrcEl === this) return;

            const container = this.parentElement;
            const children = Array.from(container.children);
            const srcIndex = children.indexOf(dragSrcEl);
            const destIndex = children.indexOf(this);

            if (srcIndex < destIndex) {
                container.insertBefore(dragSrcEl, this.nextSibling);
            } else {
                container.insertBefore(dragSrcEl, this);
            }

            dragSrcEl = null;
            updateWidgetOrderFromDOM();
        }

        function handleDragEnd() {
            this.classList.remove("dragging");
        }

        function attachDragHandlers() {
            getWidgetElements().forEach((el) => {
                el.addEventListener("dragstart", handleDragStart);
                el.addEventListener("dragover", handleDragOver);
                el.addEventListener("drop", handleDrop);
                el.addEventListener("dragend", handleDragEnd);
            });
        }

        function updateWidgetOrderFromDOM() {
            const container = document.querySelector(".widgets-container");
            if (!container) return;
            state.widgetOrder = Array.from(container.children)
                .filter((el) => el.dataset && el.dataset.widget)
                .map((el) => el.dataset.widget);
            saveState();
        }

        function applyWidgetOrder() {
            const container = document.querySelector(".widgets-container");
            if (!container || !state.widgetOrder) return;
            const map = {};
            getWidgetElements().forEach((el) => {
                map[el.dataset.widget] = el;
            });

            state.widgetOrder.forEach((id) => {
                if (map[id]) {
                    container.appendChild(map[id]);
                }
            });

            Object.keys(map).forEach((id) => {
                if (!state.widgetOrder.includes(id)) {
                    container.appendChild(map[id]);
                    state.widgetOrder.push(id);
                }
            });
        }

        function applyWidgetVisibility() {
            const hidden = new Set(state.hiddenWidgets || []);
            getWidgetElements().forEach((el) => {
                const id = el.dataset.widget;
                el.classList.toggle("widget-hidden", hidden.has(id));
            });

            document.querySelectorAll("[data-widget-toggle]").forEach((input) => {
                const id = input.getAttribute("data-widget-toggle");
                input.checked = !hidden.has(id);
            });
        }

        function initWidgetToggles() {
            document.querySelectorAll("[data-widget-toggle]").forEach((input) => {
                input.addEventListener("change", (e) => {
                    const id = e.target.getAttribute("data-widget-toggle");
                    const visible = e.target.checked;
                    const hidden = new Set(state.hiddenWidgets || []);
                    if (!visible) hidden.add(id);
                    else hidden.delete(id);
                    state.hiddenWidgets = Array.from(hidden);
                    saveState();
                    applyWidgetVisibility();
                });
            });
        }

        function initSettingsEvents() {
            const langSelect = document.getElementById("lang-select");
            if (langSelect) {
                langSelect.addEventListener("change", (e) => {
                    state.lang = e.target.value;
                    saveState();
                    changeLang();
                });
            }

            const engineSelect = document.getElementById("engine-select");
            if (engineSelect) {
                engineSelect.addEventListener("change", (e) => {
                    state.engine = e.target.value;
                    saveState();
                    changeEngine();
                });
            }

            const nextBtn = document.getElementById("btn-next");
            if (nextBtn) {
                nextBtn.addEventListener("click", nextGradient);
            }

            const moveBtn = document.getElementById("btn-move-mode");
            if (moveBtn) {
                moveBtn.addEventListener("click", toggleMoveMode);
            }

            const addSpotifyBtn = document.getElementById("spotify-add-btn");
            if (addSpotifyBtn) {
                addSpotifyBtn.addEventListener("click", addSpotifyPlaylist);
            }

            const clearSpotifyBtn = document.getElementById("spotify-clear-btn");
            if (clearSpotifyBtn) {
                clearSpotifyBtn.addEventListener("click", clearSpotifyPlaylists);
            }
        }

        const cities = [
            "Москва", "Санкт-Петербург", "Новосибирск", "Екатеринбург", "Казань", "Нижний Новгород", "Самара", "Омск", "Челябинск", "Ростов-на-Дону",
            "Уфа", "Красноярск", "Воронеж", "Пермь", "Волгоград", "Сочи", "Владивосток", "Хабаровск", "Калининград", "Ярославль",
            "Нью-Йорк", "Лос-Анджелес", "Чикаго", "Майами", "Сан-Франциско", "Лас-Вегас", "Торонто", "Ванкувер", "Мехико", "Рио-де-Жанейро",
            "Буэнос-Айрес", "Сан-Паулу", "Лондон", "Париж", "Берлин", "Мадрид", "Барселона", "Рим", "Милан", "Амстердам",
            "Брюссель", "Вена", "Прага", "Будапешт", "Варшава", "Копенгаген", "Стокгольм", "Осло", "Хельсинки", "Дублин",
            "Женева", "Цюрих", "Афины", "Ницца", "Анталья", "Стамбул", "Дубай", "Абу-Даби", "Катар", "Кейптаун",
            "Каир", "Касабланка", "Токио", "Осака", "Сеул", "Пекин", "Шанхай", "Гуанчжоу", "Гонконг", "Сингапур",
            "Бангкок", "Ханой", "Хошимин", "Дели", "Мумбаи", "Б Bengaluru", "Сидней", "Мельбурн", "Окленд", "Аделаида",
            "Астана", "Алматы", "Бишкек", "Тбилиси", "Ереван", "Минск", "Кишинёв"
        ];

        function initCities() {
            const sel = document.getElementById("city-select");
            if (!sel) return;
            sel.innerHTML = "";
            cities.forEach((c) => {
                const opt = document.createElement("option");
                opt.value = c;
                opt.textContent = c;
                sel.appendChild(opt);
            });

            sel.addEventListener("change", () => {
                state.city = sel.value;
                saveState();
                updateTemperature();
            });
        }

        function updateTemperature() {
            const temp = document.getElementById("temp");
            const sel = document.getElementById("city-select");
            if (!temp || !sel) return;
            const base = sel.selectedIndex >= 0 ? 10 : 12;
            temp.textContent = `${Math.floor(Math.random() * 20 + base)}°C`;
        }

        function normalizeSpotifyUrl(url) {
            try {
                const u = new URL(url.trim());
                if (!u.hostname.includes("spotify.com")) return null;
                const parts = u.pathname.split("/").filter(Boolean);
                if (parts.length < 2) return null;
                const type = parts[0];
                const id = parts[1];
                return `https://open.spotify.com/embed/${type}/${id}?utm_source=generator`;
            } catch (e) {
                return null;
            }
        }

        function renderSpotifyPlaylists() {
            const list = document.getElementById("spotify-list");
            if (!list) return;
            list.innerHTML = "";

            const lang = state.lang || "ru";
            const t = translations[lang] || translations.ru;

            const playlists = state.spotifyPlaylists || [];
            if (!playlists.length) {
                const p = document.createElement("p");
                p.className = "spotify-empty";
                p.textContent = t.noPlaylists;
                list.appendChild(p);
                return;
            }

            playlists.forEach((url) => {
                const src = normalizeSpotifyUrl(url) || url;
                const iframe = document.createElement("iframe");
                iframe.src = src;
                iframe.width = "100%";
                iframe.height = "152";
                iframe.frameBorder = "0";
                iframe.allow = "autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture";
                iframe.loading = "lazy";
                iframe.style.borderRadius = "12px";
                list.appendChild(iframe);
            });
        }

        function addSpotifyPlaylist() {
            const input = document.getElementById("spotify-url");
            if (!input) return;
            const value = (input.value || "").trim();
            if (!value) return;
            if (!state.spotifyPlaylists) state.spotifyPlaylists = [];
            state.spotifyPlaylists.push(value);
            input.value = "";
            saveState();
            renderSpotifyPlaylists();
        }

        function clearSpotifyPlaylists() {
            state.spotifyPlaylists = [];
            saveState();
            renderSpotifyPlaylists();
        }

        function applyState() {
            const langSelect = document.getElementById("lang-select");
            if (langSelect) {
                langSelect.value = state.lang || "ru";
            }
            const engineSelect = document.getElementById("engine-select");
            if (engineSelect) {
                engineSelect.value = state.engine || "google";
            }

            const index = state.gradientIndex || 0;
            state.gradientIndex = index;
            document.body.style.background = gradients[index];

            const sel = document.getElementById("city-select");
            if (sel && state.city) {
                const exists = Array.from(sel.options).some(
                    (o) => o.value === state.city
                );
                if (!exists) {
                    const opt = document.createElement("option");
                    opt.value = state.city;
                    opt.textContent = state.city;
                    sel.appendChild(opt);
                }
                sel.value = state.city;
            }
            updateTemperature();

            applyWidgetOrder();
            applyWidgetVisibility();

            changeLang();
            changeEngine();
            setMoveMode(state.moveMode, { skipSave: true });

            renderSpotifyPlaylists();

            const versionEl = document.getElementById("version-text");
            if (versionEl) versionEl.textContent = `v.${state.version || DB_VERSION}`;
        }

        document.addEventListener("DOMContentLoaded", () => {
            initCities();
            attachDragHandlers();
            initWidgetToggles();
            initSettingsEvents();
            applyState();
        });
    </script>
</body>
</html>
